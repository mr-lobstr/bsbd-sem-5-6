services:
    db_builder:
        image: db_builder_image:1
        container_name: db_builder
        build:
            context: .
            dockerfile: Dockerfile.db_builder
        ports:
            - "15432:5432"
        command: sh -c "chown postgres:postgres /etc/postgresql/ssl && docker-entrypoint.sh postgres"
        volumes:
            - db_storage:/var/lib/postgresql/18
            - ssl_keys:/etc/postgresql/ssl

volumes:
    db_storage:
        driver: local

    ssl_keys:
        driver: local

